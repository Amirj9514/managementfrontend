<p-table [value]="rowArray" [tableStyle]="{ 'min-width': '50rem' }">
  <ng-template #header>
    <tr>
      @for (col of columnArray; track $index) {
        <th>
          <p-skeleton width="60%" />
        </th>
      }
    </tr>
  </ng-template>
  <ng-template #body>
    <tr>
      @for (col of columnArray; track $index) {
        <td>
          <p-skeleton />
        </td>
      }
    </tr>
  </ng-template>
</p-table>
