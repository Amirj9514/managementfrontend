<app-page-header [title]="'nav.hr' | translate" [subtitle]="'hr.subtitle' | translate" />
<p-card>
  @if (!loading() && rows().length === 0) {
    <app-empty-state [title]="'hr.emptyTitle' | translate" [description]="'hr.emptyDescription' | translate" />
  } @else {
    <p-table [value]="rows()" [loading]="loading()" [tableStyle]="{ 'min-width': '36rem' }">
      <ng-template #header>
        <tr>
          <th>{{ 'common.name' | translate }}</th>
          <th>{{ 'common.email' | translate }}</th>
          <th>{{ 'common.role' | translate }}</th>
        </tr>
      </ng-template>
      <ng-template #body let-row>
        <tr>
          <td>{{ row.name }}</td>
          <td>{{ row.email ?? '—' }}</td>
          <td>{{ row.role ? ('role.' + row.role | translate) : '—' }}</td>
        </tr>
      </ng-template>
    </p-table>
  }
</p-card>
