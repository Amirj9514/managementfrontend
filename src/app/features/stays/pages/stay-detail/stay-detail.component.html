@if (loading()) {
  <p-skeleton width="14rem" height="2rem" class="mb-3" />
  <p-skeleton width="100%" height="6rem" />
} @else if (stay(); as s) {
  <app-page-header title="Stay" [subtitle]="'Status: ' + s.status" />
  <p-card>
    <p>Guest: {{ s.guestId ?? '—' }}</p>
    <p>Check-in: {{ s.checkIn ?? '—' }}</p>
    <p>Check-out: {{ s.checkOut ?? '—' }}</p>
    <div class="stay-detail__actions">
      <p-button label="Back" [outlined]="true" (onClick)="back()" />
    </div>
  </p-card>
}
