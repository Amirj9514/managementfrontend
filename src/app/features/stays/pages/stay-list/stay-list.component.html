<app-page-header title="Stays" subtitle="Reservations and in-house stays." />
<p-card>
  @if (!loading() && rows().length === 0) {
    <app-empty-state title="No stays" description="No stay records returned." />
  } @else {
    <p-table [value]="rows()" [loading]="loading()" [tableStyle]="{ 'min-width': '42rem' }">
      <ng-template #header>
        <tr>
          <th>Status</th>
          <th>Check-in</th>
          <th>Check-out</th>
          <th style="width: 12rem">Actions</th>
        </tr>
      </ng-template>
      <ng-template #body let-row>
        <tr>
          <td>{{ row.status }}</td>
          <td>{{ row.checkIn ?? '—' }}</td>
          <td>{{ row.checkOut ?? '—' }}</td>
          <td>
            <p-button label="Detail" [text]="true" size="small" (onClick)="open(row.id)" />
            <p-button label="Folio" [text]="true" size="small" (onClick)="openFolio(row.id)" />
          </td>
        </tr>
      </ng-template>
    </p-table>
  }
</p-card>
