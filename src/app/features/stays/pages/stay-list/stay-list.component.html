<app-page-header [title]="'nav.stays' | translate" [subtitle]="'stays.subtitle' | translate" />
<p-card>
  @if (!loading() && rows().length === 0) {
    <app-empty-state [title]="'stays.emptyTitle' | translate" [description]="'stays.emptyDescription' | translate" />
  } @else {
    <p-table [value]="rows()" [loading]="loading()" [tableStyle]="{ 'min-width': '42rem' }">
      <ng-template #header>
        <tr>
          <th>{{ 'common.status' | translate }}</th>
          <th>{{ 'stays.checkIn' | translate }}</th>
          <th>{{ 'stays.checkOut' | translate }}</th>
          <th style="width: 12rem">{{ 'common.actions' | translate }}</th>
        </tr>
      </ng-template>
      <ng-template #body let-row>
        <tr>
          <td><app-status-badge [status]="row.status" /></td>
          <td>{{ row.checkIn ?? '—' }}</td>
          <td>{{ row.checkOut ?? '—' }}</td>
          <td>
            <p-button [label]="'stays.detailAction' | translate" [text]="true" size="small" (onClick)="open(row.id)" />
          </td>
        </tr>
      </ng-template>
    </p-table>
  }
</p-card>
