@if (loading()) {
  <p-skeleton width="12rem" height="2rem" class="mb-3" />
  <p-skeleton width="100%" height="8rem" />
} @else if (guest(); as g) {
  <app-page-header [title]="g.firstName + ' ' + g.lastName" subtitle="Guest profile" />
  <p-card>
    <div class="detail-grid">
      <div>
        <span class="detail-label">Email</span>
        <p>{{ g.email ?? '—' }}</p>
      </div>
      <div>
        <span class="detail-label">Phone</span>
        <p>{{ g.phone ?? '—' }}</p>
      </div>
      <div>
        <span class="detail-label">Nationality</span>
        <p>{{ g.nationality ?? '—' }}</p>
      </div>
      <div>
        <span class="detail-label">Passport</span>
        <p>{{ g.passportNumber ?? '—' }}</p>
      </div>
    </div>
    <div class="detail-actions">
      <p-button label="Back to list" [outlined]="true" (onClick)="back()" />
      @if (canWrite()) {
        <p-button label="Edit" (onClick)="edit(g.id)" />
      }
    </div>
  </p-card>
}
