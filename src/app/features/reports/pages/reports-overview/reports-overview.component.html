<app-page-header [title]="'entity.reports' | translate" [subtitle]="'rp.subtitle' | translate" />

<section class="rp-filter">
  <div class="rp-filter__top">
    @if (branches().length > 1) {
      <p-select [options]="branches()" optionLabel="name" optionValue="_id" [ngModel]="branchId()" (ngModelChange)="branchId.set($event ?? undefined)" [placeholder]="'reports.selectBranch' | translate" styleClass="w-14rem" />
    }
  </div>
  <app-report-range [(preset)]="preset" [(from)]="from" [(to)]="to" />
</section>

<nav class="rp-tabs" role="tablist" [attr.aria-label]="'entity.reports' | translate">
  @for (t of tabs; track t.key) {
    <button type="button" class="rp-tab" role="tab" [class.rp-tab--on]="view() === t.key" [attr.aria-selected]="view() === t.key" (click)="setView(t.key)">
      <i [class]="t.icon"></i> {{ 'rp.tab.' + t.key | translate }}
    </button>
  }
</nav>

@if (!branchId()) {
  @if (loaded()) {
    <app-empty-state [title]="'reports.selectBranchTitle' | translate" [description]="'reports.selectBranchDesc' | translate" />
  }
} @else {
  @switch (view()) {
    @case ('summary') {
      <app-report-summary [branchId]="branchId()!" [from]="fromKey()" [to]="toKey()" />
    }
    @case ('checkins') {
      <app-report-movements kind="in" [branchId]="branchId()!" [from]="fromKey()" [to]="toKey()" />
    }
    @case ('checkouts') {
      <app-report-movements kind="out" [branchId]="branchId()!" [from]="fromKey()" [to]="toKey()" />
    }
    @case ('cleaning') {
      <app-report-cleaning [branchId]="branchId()!" [from]="fromKey()" [to]="toKey()" />
    }
    @case ('guests') {
      <app-report-guests [branchId]="branchId()!" [from]="fromKey()" [to]="toKey()" />
    }
    @case ('occupancy') {
      <app-report-occupancy [branchId]="branchId()!" [from]="fromKey()" [to]="toKey()" />
    }
  }
}
