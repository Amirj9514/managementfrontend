<app-page-header title="Amenities" subtitle="Manage the amenity catalog used by room and hall listings." />

<p-toolbar styleClass="mb-4">
  <ng-template #start>
    <p-button label="New amenity" icon="pi pi-plus" (onClick)="openCreate()" />
  </ng-template>
</p-toolbar>

<p-card>
  @if (!loading() && rows().length === 0) {
    <app-empty-state title="No amenities yet" description="Add amenities like Wi-Fi, AC, or a private bathroom."
      actionLabel="New amenity" (actionClick)="openCreate()" />
  } @else {
    <p-table [value]="rows()" [loading]="loading()" dataKey="_id">
      <ng-template #header>
        <tr>
          <th>Name</th>
          <th>Category</th>
          <th>Status</th>
          <th style="width: 6rem"></th>
        </tr>
      </ng-template>
      <ng-template #body let-row>
        <tr>
          <td class="font-medium">{{ row.name }}</td>
          <td>{{ row.category || '—' }}</td>
          <td>
            @if (row.active) {
              <p-tag value="Active" severity="success" [rounded]="true" />
            } @else {
              <p-tag value="Inactive" severity="secondary" [rounded]="true" />
            }
          </td>
          <td style="text-align: right">
            <p-button icon="pi pi-pencil" [text]="true" [rounded]="true" (onClick)="openEdit(row)" />
            <p-button icon="pi pi-trash" [text]="true" [rounded]="true" severity="danger" (onClick)="remove(row)" />
          </td>
        </tr>
      </ng-template>
    </p-table>
  }
</p-card>

<p-dialog [header]="isEdit() ? 'Edit amenity' : 'New amenity'" [(visible)]="formVisible" [modal]="true"
  [style]="{ width: 'min(28rem, 100vw)' }">
  <form [formGroup]="form" (ngSubmit)="submit()">
    <p-fluid>
      <div class="field mb-3">
        <label for="a-name">Name</label>
        <input pInputText id="a-name" formControlName="name" placeholder="e.g. Free Wi-Fi" autocomplete="off" />
        <app-field-error [control]="form.controls.name" label="Name" />
      </div>
      <div class="field mb-3">
        <label for="a-icon">Icon (optional)</label>
        <input pInputText id="a-icon" formControlName="icon" placeholder="pi pi-wifi" autocomplete="off" />
      </div>
      <div class="field mb-3">
        <label for="a-category">Category (optional)</label>
        <input pInputText id="a-category" formControlName="category" placeholder="e.g. Connectivity" autocomplete="off" />
      </div>
      <div class="field mb-3 flex align-items-center gap-2">
        <p-toggleswitch formControlName="active" inputId="a-active" />
        <label for="a-active">Active</label>
      </div>
      <div class="flex justify-content-end gap-2">
        <p-button type="button" label="Cancel" [outlined]="true" (onClick)="formVisible.set(false)" />
        <p-button type="submit" [label]="isEdit() ? 'Save changes' : 'Create amenity'" [loading]="saving()" />
      </div>
    </p-fluid>
  </form>
</p-dialog>

<p-confirm-dialog />
