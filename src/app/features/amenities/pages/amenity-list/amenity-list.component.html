<app-page-header [title]="'nav.amenities' | translate" [subtitle]="'amenities.subtitle' | translate" />

<p-toolbar styleClass="mb-4">
  <ng-template #start>
    <p-button [label]="'amenities.newAmenity' | translate" icon="pi pi-plus" (onClick)="openCreate()" />
  </ng-template>
</p-toolbar>

<p-card>
  @if (!loading() && rows().length === 0) {
    <app-empty-state [title]="'amenities.empty.title' | translate" [description]="'amenities.empty.description' | translate"
      [actionLabel]="'amenities.newAmenity' | translate" (actionClick)="openCreate()" />
  } @else {
    <p-table [value]="rows()" [loading]="loading()" dataKey="_id">
      <ng-template #header>
        <tr>
          <th>{{ 'common.name' | translate }}</th>
          <th>{{ 'amenities.category' | translate }}</th>
          <th>{{ 'common.status' | translate }}</th>
          <th style="width: 6rem"></th>
        </tr>
      </ng-template>
      <ng-template #body let-row>
        <tr>
          <td class="font-medium">{{ row.name }}</td>
          <td>{{ row.category || '—' }}</td>
          <td>
            @if (row.active) {
              <p-tag [value]="'status.active' | translate" severity="success" [rounded]="true" />
            } @else {
              <p-tag [value]="'status.inactive' | translate" severity="secondary" [rounded]="true" />
            }
          </td>
          <td style="text-align: right">
            <p-button icon="pi pi-pencil" [text]="true" [rounded]="true" (onClick)="openEdit(row)" />
            <p-button icon="pi pi-trash" [text]="true" [rounded]="true" severity="danger" (onClick)="remove(row)" />
          </td>
        </tr>
      </ng-template>
    </p-table>
  }
</p-card>

<p-dialog [header]="(isEdit() ? 'amenities.formHeaderEdit' : 'amenities.formHeaderNew') | translate" [(visible)]="formVisible" [modal]="true"
  [style]="{ width: 'min(28rem, 100vw)' }">
  <form [formGroup]="form" (ngSubmit)="submit()">
    <p-fluid>
      <div class="field mb-3">
        <label for="a-name">{{ 'common.name' | translate }}</label>
        <input pInputText id="a-name" formControlName="name" [placeholder]="'amenities.namePlaceholder' | translate" autocomplete="off" />
        <app-field-error [control]="form.controls.name" [label]="'common.name' | translate" />
      </div>
      <div class="field mb-3">
        <label for="a-icon">{{ 'amenities.icon' | translate }}</label>
        <input pInputText id="a-icon" formControlName="icon" placeholder="pi pi-wifi" autocomplete="off" />
      </div>
      <div class="field mb-3">
        <label for="a-category">{{ 'amenities.categoryOptional' | translate }}</label>
        <input pInputText id="a-category" formControlName="category" [placeholder]="'amenities.categoryPlaceholder' | translate" autocomplete="off" />
      </div>
      <div class="field mb-3 flex align-items-center gap-2">
        <p-toggleswitch formControlName="active" inputId="a-active" />
        <label for="a-active">{{ 'status.active' | translate }}</label>
      </div>
      <div class="flex justify-content-end gap-2">
        <p-button type="button" [label]="'common.cancel' | translate" [outlined]="true" (onClick)="formVisible.set(false)" />
        <p-button type="submit" [label]="(isEdit() ? 'common.saveChanges' : 'amenities.createAmenity') | translate" [loading]="saving()" />
      </div>
    </p-fluid>
  </form>
</p-dialog>

<p-confirm-dialog />
