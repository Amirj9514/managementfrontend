<div class="register">
  <h1 class="register__title">Create account</h1>
  <p class="register__subtitle">Register when your API allows bootstrap sign-up.</p>
  <form class="register__form" [formGroup]="form" (ngSubmit)="submit()">
    <p-fluid>
      <div class="field">
        <label for="name">Name</label>
        <input pInputText id="name" formControlName="name" autocomplete="name" />
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input pInputText id="email" type="email" formControlName="email" autocomplete="username" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input
          pInputText
          id="password"
          type="password"
          formControlName="password"
          autocomplete="new-password"
        />
      </div>
      <p-button
        type="submit"
        label="Create account"
        [loading]="submitting"
        styleClass="w-full"
      />
    </p-fluid>
  </form>
  <p class="register__footer">
    Already have an account?
    <a routerLink="/login">Sign in</a>
  </p>
</div>
