<div class="login">
  <h1 class="login__title">{{ 'auth.login.title' | translate }}</h1>
  <p class="login__subtitle">{{ 'auth.login.subtitle' | translate }}</p>
  <form class="login__form" [formGroup]="form" (ngSubmit)="submit()">
    <p-fluid>
      <div class="field">
        <label for="email">{{ 'common.email' | translate }}</label>
        <input pInputText id="email" type="email" formControlName="email" autocomplete="username" />
        <app-field-error [control]="form.controls.email" [label]="'common.email' | translate" />
      </div>
      <div class="field">
        <label for="password">{{ 'common.password' | translate }}</label>
        <input
          pInputText
          id="password"
          type="password"
          formControlName="password"
          autocomplete="current-password"
        />
        <app-field-error [control]="form.controls.password" [label]="'common.password' | translate" />
      </div>
      <p-button
        type="submit"
        [label]="'auth.login.submit' | translate"
        [loading]="submitting"
        styleClass="w-full"
      />
    </p-fluid>
  </form>
  <p class="login__footer">
    {{ 'auth.login.noAccount' | translate }}
    <a routerLink="/register">{{ 'auth.login.registerLink' | translate }}</a>
  </p>
</div>
