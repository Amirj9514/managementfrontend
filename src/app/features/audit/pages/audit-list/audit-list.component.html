<app-page-header [title]="'nav.auditLog' | translate" [subtitle]="'audit.subtitle' | translate" />
<p-card>
  @if (!loading() && rows().length === 0) {
    <app-empty-state [title]="'audit.emptyTitle' | translate" [description]="'audit.emptyDescription' | translate" />
  } @else {
    <p-table [value]="rows()" [loading]="loading()" [tableStyle]="{ 'min-width': '44rem' }">
      <ng-template #header>
        <tr>
          <th>{{ 'audit.when' | translate }}</th>
          <th>{{ 'audit.action' | translate }}</th>
          <th>{{ 'audit.resource' | translate }}</th>
          <th>{{ 'audit.user' | translate }}</th>
        </tr>
      </ng-template>
      <ng-template #body let-row>
        <tr>
          <td>{{ row.createdAt }}</td>
          <td>{{ row.action }}</td>
          <td>{{ row.resource ?? '—' }}</td>
          <td>{{ row.userId ?? '—' }}</td>
        </tr>
      </ng-template>
    </p-table>
  }
</p-card>
